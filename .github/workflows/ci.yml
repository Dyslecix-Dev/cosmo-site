name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir ${{ github.workspace }}/dist --exclude opengraph.xyz --exclude cosmo.dyslecix.dev --exclude vite-pwa-org.netlify.app dist
          fail: true
