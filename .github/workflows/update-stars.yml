name: Update GitHub stars

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch star count
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api repos/DyslecixDev/cosmo --jq .stargazers_count)
          if ! [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "Invalid count: $count" >&2
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Write stars.json
        run: |
          printf '{\n  "stargazers_count": %s\n}\n' "${{ steps.fetch.outputs.count }}" > src/data/stars.json

      - name: Commit if changed
        run: |
          if git diff --quiet src/data/stars.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/stars.json
          git commit -m "chore: update GitHub star count"
          git push
